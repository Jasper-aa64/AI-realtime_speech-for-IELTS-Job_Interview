<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>IELTS Audio Core WASM Demo</title>
    <style>
      body {
        margin: 0;
        font-family: Inter, ui-sans-serif, system-ui, -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif;
        background: #f7f8fb;
        color: #111827;
      }

      main {
        max-width: 920px;
        margin: 0 auto;
        padding: 48px 24px;
      }

      .panel {
        background: #fff;
        border: 1px solid #e5e7eb;
        border-radius: 16px;
        box-shadow: 0 18px 60px rgba(15, 23, 42, 0.08);
        padding: 28px;
      }

      .eyebrow {
        color: #4b5563;
        font-size: 13px;
        font-weight: 800;
        letter-spacing: 0.08em;
        text-transform: uppercase;
      }

      h1 {
        margin: 10px 0 12px;
        font-size: 34px;
        line-height: 1.12;
      }

      p {
        color: #4b5563;
        font-size: 16px;
        line-height: 1.65;
      }

      button {
        border: 0;
        border-radius: 999px;
        background: #0f9f7a;
        color: white;
        cursor: pointer;
        font-size: 16px;
        font-weight: 800;
        margin-top: 18px;
        padding: 13px 22px;
      }

      button:disabled {
        cursor: wait;
        opacity: 0.65;
      }

      pre {
        overflow: auto;
        border-radius: 12px;
        background: #101827;
        color: #e5f2ff;
        font-size: 14px;
        line-height: 1.55;
        margin-top: 22px;
        min-height: 140px;
        padding: 18px;
        white-space: pre-wrap;
      }

      code {
        font-family: ui-monospace, SFMono-Regular, Menlo, Monaco, Consolas, "Liberation Mono", monospace;
      }
    </style>
  </head>
  <body>
    <main>
      <section class="panel">
        <div class="eyebrow">Experiment 5 foundation</div>
        <h1>C++ audio_core running in the browser</h1>
        <p>
          This standalone demo does not touch the production P1/P2/P3 recording flow.
          Build the generated WASM files with <code>scripts/build_audio_core_wasm.sh</code>,
          then run the smoke test below.
        </p>
        <button id="runDemo" type="button">Run WASM smoke test</button>
        <pre id="output">Waiting for generated audio_core_wasm.js...</pre>
      </section>
    </main>
    <script type="module" src="./audio_core_demo.js"></script>
  </body>
</html>
